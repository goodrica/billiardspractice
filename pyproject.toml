[project]
name = "billiardspractice"
version = "0.1.0"
description = "Camera/projector assisted billiards practice software"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
billiards-practice = "billiardspractice.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["billiardspractice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
